<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de noticia | Actualidad Noticias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos/styles.css">
</head>
<body>

  <!-- ========== ENCABEZADO ========== -->
  <header class="encabezado">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a class="logo-sitio" href="index.html">
          <span class="acento">▲</span> Actualidad <span class="acento">Noticias</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto menu-navegacion">
            <li class="nav-item">
              <a class="nav-link" href="index.html"><i class="bi bi-house-door"></i> Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="agregar.html"><i class="bi bi-plus-circle"></i> Agregar Noticia</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="listado.html"><i class="bi bi-star"></i> Destacadas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contacto.html"><i class="bi bi-envelope"></i> Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ========== CONTENIDO ========== -->
  <main class="container py-4 py-md-5" id="contenido-detalle">
    <div class="row g-4">
      <!-- Columna principal: contenido de la noticia -->
      <div class="col-lg-8">
        <!-- Imagen hero -->
        <img id="imagen-hero" src="" alt="" class="imagen-hero">

        <!-- Título -->
        <h1 id="titulo-detalle" class="titulo-detalle"></h1>

        <!-- Meta información -->
        <div class="meta-detalle">
          <span><i class="bi bi-calendar3"></i> <span id="fecha-detalle"></span></span>
          <span><i class="bi bi-building"></i> Fuente: <span id="fuente-detalle"></span></span>
          <span class="categoria-etiqueta" id="categoria-detalle"></span>
        </div>

        <!-- Cuerpo del artículo -->
        <div id="cuerpo-noticia" class="cuerpo-noticia">
          <!-- Se llena con JavaScript -->
        </div>
      </div>

      <!-- Columna lateral: acciones -->
      <div class="col-lg-4">
        <div class="panel-acciones">
          <!-- Botón Destacar -->
          <button id="boton-destacar" class="boton-destacar mb-3">
            <i class="bi bi-fire"></i>
            Destacar esta noticia
            <span id="contador-votos-detalle" class="ms-1"></span>
          </button>

          <!-- Acciones secundarias -->
          <a href="#" class="accion-secundaria">
            <i class="bi bi-bookmark"></i> Guardar noticia
          </a>
          <a href="#" class="accion-secundaria">
            <i class="bi bi-share"></i> Compartir
          </a>
          <a href="index.html" class="accion-secundaria">
            <i class="bi bi-arrow-left"></i> Volver al inicio
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- ========== PIE ========== -->
  <footer class="pie-pagina">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6 mb-3 mb-md-0">
          <a href="index.html" class="logo-sitio mb-2 d-inline-block">
            <span class="acento">▲</span> Actualidad <span class="acento">Noticias</span>
          </a>
          <p class="text-secondary small mb-0">© 2026 Actualidad Noticias. Todos los derechos reservados.</p>
        </div>
        <div class="col-md-6 text-md-end">
          <a href="contacto.html" class="me-3">Contacto</a>
          <a href="#" class="me-3">Privacidad</a>
          <a href="#" class="me-3">Términos de uso</a>
          <span class="redes-sociales">
            <a href="#"><i class="bi bi-twitter-x"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-youtube"></i></a>
          </span>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
