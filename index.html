<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Iconos Bootstrap -->

  <link rel="stylesheet" href="estilos/styles.css">
</head>
<body>

  <!-- ========== ENCABEZADO / NAVEGACIÓN ========== -->
  <header class="encabezado">
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <!-- Logo -->
        <a class="logo-sitio" href="index.html">
          <span class="acento">▲</span> Actualidad <span class="acento">Noticias</span>
        </a>

        <!-- Botón hamburguesa (móvil) -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú de navegación -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto menu-navegacion">
            <li class="nav-item">
              <a class="nav-link activo" href="index.html">
                <i class="bi bi-house-door"></i> Inicio
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="agregar.html">
                <i class="bi bi-plus-circle"></i> Agregar Noticia
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="listado.html">
                <i class="bi bi-star"></i> Destacadas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contacto.html">
                <i class="bi bi-envelope"></i> Contacto
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ========== CONTENIDO PRINCIPAL ========== -->
  <main class="container py-4 py-md-5">
    <!-- Título de la sección -->
    <div class="mb-4">
      <h1 class="titulo-pagina">Noticias del día</h1>
      <p class="subtitulo-pagina">Las historias más relevantes según la comunidad</p>
    </div>

    <!-- Grid dinámico de noticias (masonry simulado) -->
    <!-- Las tarjetas cambian de tamaño según los votos "Destacar" -->
    <div id="grid-noticias" class="contenedor-noticias">
      <!-- Las tarjetas se generan dinámicamente con JavaScript -->
    </div>
  </main>

  <!-- ========== PIE DE PÁGINA ========== -->
  <footer class="pie-pagina">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6 mb-3 mb-md-0">
          <a href="index.html" class="logo-sitio mb-2 d-inline-block">
            <span class="acento">▲</span> Actualidad <span class="acento">Noticias</span>
          </a>
          <p class="text-secondary small mb-0">
            © 2026 Actualidad Noticias. Todos los derechos reservados.
